memory_limit = -1
error_reporting = E_ALL
display_errors = On
date.timezone = UTC
opcache.enable_cli = 1
; wpdb::print_error() calls error_log(); with the CLI default (stderr) a test run
; in a separate process can deadlock PHPUnit 9's pipe handling when a DB
; adapter emits many errors. Send it to a file instead.
log_errors = On
error_log = /tmp/php-error.log
