name: Epic
description: Large body of work spanning several stories (one roadmap area within a milestone)
title: "[E##] "
type: Epic
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Outcome this epic delivers and why it matters.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Objective, evidence-based exit conditions.
      value: "- [ ] "
    validations:
      required: true
  - type: input
    id: prd
    attributes:
      label: PRD references
      placeholder: docs/08-roadmap.md
  - type: textarea
    id: risks
    attributes:
      label: Security / UUID / migration impact
