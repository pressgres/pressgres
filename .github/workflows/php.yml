name: PHP

# CI matrix (I-011, ADR-0006): PHP 8.4 is the required, blocking cell.
# PHP 8.5 is an exploratory candidate: it runs the same checks but is
# non-blocking, and a green result does not make PHP 8.5 supported.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    continue-on-error: ${{ matrix.tier == 'exploratory' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the required cell's job name stable: it is the status check.
          - name: checks
            cell: php-8.4
            tier: required
            image: php:8.4.27-cli-bookworm@sha256:b3e907a1108629c562c4bb313ce3449e34d49991f6bb2487913f6146f47200fe
          - name: checks (exploratory, PHP 8.5)
            cell: php-8.5
            tier: exploratory
            image: php:8.5.13-cli-bookworm@sha256:d6991172c4282d2a09d6418073923a81664173bb0a0e07a16663a9a645746092
    env:
      COMPOSER_ALLOW_SUPERUSER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Composer 2.10.3
        run: |
          sed -i 's|http://deb.debian.org|https://deb.debian.org|g' /etc/apt/sources.list.d/debian.sources
          apt-get update -qq
          apt-get install --no-install-recommends -y unzip
          curl -fsSL https://getcomposer.org/download/2.10.3/composer.phar -o /tmp/composer.phar
          echo '7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6  /tmp/composer.phar' | sha256sum -c -
          install -m 0755 /tmp/composer.phar /usr/local/bin/composer
      - run: php -v
      - run: composer validate --strict
      - run: composer validate --strict packages/contracts/composer.json
      - run: composer validate --strict apps/installer-cli/composer.json
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer check-platform-reqs
      - run: composer audit
      - run: composer cs
      - run: composer analyse
      - run: composer test
      - name: Record cell outcome
        if: always()
        env:
          CELL: ${{ matrix.cell }}
          TIER: ${{ matrix.tier }}
          IMAGE: ${{ matrix.image }}
          OUTCOME: ${{ job.status }}
        run: |
          mkdir -p .matrix-cell
          printf '| %s | %s | %s | %s |\n' "$CELL" "$TIER" "\`${IMAGE%@*}\`" "$OUTCOME" > ".matrix-cell/$CELL.md"
          cat ".matrix-cell/$CELL.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload cell outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-cell-${{ matrix.cell }}
          path: .matrix-cell/${{ matrix.cell }}.md
          retention-days: 7

  summary:
    name: PHP matrix summary
    needs: checks
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: matrix-cell-*
          merge-multiple: true
          path: cells
      - name: Write job summary
        run: |
          {
            echo '## PHP matrix'
            echo
            echo '| Cell | Tier | Image | Outcome |'
            echo '|---|---|---|---|'
            cat cells/*.md 2>/dev/null || echo '| (no cell results) | | | |'
            echo
            echo 'Required cells block merges. Exploratory cells are non-blocking;'
            echo 'a green exploratory cell does not mean the version is supported (ADR-0006).'
          } >> "$GITHUB_STEP_SUMMARY"
