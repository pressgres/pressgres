name: Docs

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly external link check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Internal links always; external links too, but tolerate rate limiting.
          args: >-
            --no-progress
            --accept 200,206,429
            --max-retries 3
            --exclude "^https://github\.com/orgs/pressgres/projects"
            "**/*.md"
          fail: true

  mermaid:
    name: Mermaid diagrams render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Render every .mmd file
        run: |
          echo '{"args":["--no-sandbox"]}' > /tmp/puppeteer.json
          mkdir -p /tmp/mmd
          for f in diagrams/*.mmd; do
            echo "::group::$f"
            npx --yes @mermaid-js/mermaid-cli@12.2.0 -p /tmp/puppeteer.json -i "$f" -o "/tmp/mmd/$(basename "$f" .mmd).svg"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagrams-svg
          path: /tmp/mmd/*.svg
          retention-days: 14

  yaml:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run yamllint==1.38.0 -c .yamllint.yml .
