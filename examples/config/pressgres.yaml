# Pressgres preview configuration for PostgreSQL 18 and native UUIDv7.
# Keep this file outside the webroot. Passwords use env:NAME or file:/absolute/path.
schema_version: '1.0'
project:
  name: example-site
  environment: production
wordpress:
  version: '7.1.5' # Preview pin from the CLI release manifest.
  core_mode: managed_uuid
  auto_updates: false
  multisite: false
identity:
  type: uuid
  version: 7
  generator: postgresql
  allow_integer_fallback: false
database:
  engine: postgresql
  minimum_version: '18'
  driver: pdo_pgsql
  host: postgres.example.test
  name: pressgres
  runtime_user: wps_runtime
  password: 'env:WPS_RUNTIME_PASSWORD'
  # Supply migrator credentials only to the installer process.
  migrator_user: wps_migrator
  migrator_password: 'env:WPS_MIGRATOR_PASSWORD'
  sslmode: verify-full
  sslrootcert: /etc/pressgres/postgres-ca.pem
  unsupported_sql: reject
redis:
  enabled: true
  backend: valkey
  driver: phpredis
  host: valkey.example.test
  password: 'env:VALKEY_PASSWORD'
  tls: true
  prefix: 'pressgres:prod:site-1:' # Choose a unique namespace per site.
  fail_policy: request_local_cache
security:
  profile: hardened
  require_https: true
  separate_migration_role: true
  admin_file_modifications: false
  audit_log: true
plugins:
  unknown_policy: quarantine
  require_approved_adapters: true
  run_migrations_in_sandbox: true
installer:
  strict_versions: true
  backup_before_upgrade: true
  fail_on_missing_core_patch: true
